[package]
name = "breezone-module-weather"
version = "1.0.0"
edition.workspace = true
description = "The weather: the forecast of Open-Meteo and the warnings of MeteoAlarm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
breezone-module-sdk = { path = "../sdk" }
chrono = { version = "0.4", default-features = false, features = ["std"] }

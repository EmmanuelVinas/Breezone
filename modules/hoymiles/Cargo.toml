[package]
name = "breezone-module-hoymiles"
version = "1.1.0"
edition.workspace = true
description = "Hoymiles micro-inverters, through their Wi-Fi DTU (local protocol on TCP 10081)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
breezone-module-sdk = { path = "../sdk" }
chrono = { version = "0.4", default-features = false, features = ["std"] }

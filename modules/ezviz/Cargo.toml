[package]
name = "breezone-module-ezviz"
version = "1.1.0"
edition.workspace = true
description = "EZVIZ's cloud (cameras, doorbells), with the account of its app"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
breezone-module-sdk = { path = "../sdk" }
aes = "0.9.4"
cbc = "0.2.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
md-5 = "0.11.0"

[package]
name = "breezone-module-forecast_solar"
version = "1.0.0"
edition.workspace = true
description = "Forecast.Solar: what the solar panels should produce"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
breezone-module-sdk = { path = "../sdk" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

[package]
name = "breezone-module-homekit"
version = "1.0.0"
edition.workspace = true
description = "A HomeKit controller: accessories and bridges (Legrand, VELUX…) paired with their code"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
breezone-module-sdk = { path = "../sdk" }
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13"
num-bigint = "0.4"
sha2 = "0.11.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

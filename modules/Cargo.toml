# Modules of Breezone (docs/roadmap/modules.md): WebAssembly components built for wasm32-wasip2,
# loaded by the server only when a source uses them.
[workspace]
resolver = "2"
members = ["sdk", "anker", "anker_cloud", "deye", "forecast_solar", "hoymiles", "reolink", "shelly", "tasmota", "trydan", "tplink", "tydom", "hue", "renson", "rte", "weather", "linky", "netatmo", "ezviz", "esphome", "homekit", "airzone_local", "testing/misbehave", "testing/contract-1-0"]

[workspace.package]
edition = "2021"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

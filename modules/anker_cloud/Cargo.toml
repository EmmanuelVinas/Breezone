[package]
name = "breezone-module-anker_cloud"
version = "1.1.0"
edition.workspace = true
description = "Anker SOLIX's cloud (SolarBank), with the account of its app"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
breezone-module-sdk = { path = "../sdk" }
aes = "0.9.4"
base64 = "0.23.1"
cbc = "0.2.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hex = "0.4.3"
md-5 = "0.11.0"
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh"] }

name: CI

on:
  push:
    branches: [main, beta, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            modules
      - run: cargo fmt --check
      - run: cargo fmt --all --check --manifest-path ../modules/Cargo.toml
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Without the host of modules in WebAssembly too (the `wasm` feature, on by default).
      - run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      # Includes the modules in WebAssembly and their host (built for wasm32-wasip2 by the test).
      - run: cargo test --locked
      # The modules (native tests on the bench of the SDK).
      - run: cargo clippy --all-targets --locked --manifest-path ../modules/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path ../modules/Cargo.toml

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :androidApp:assembleDebug

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The compilation caches of the Dockerfile (Cargo registry, build folders), kept from one run to
      # the next: only what changed is compiled again. BuildKit does not keep them in the layer cache.
      - uses: actions/cache@v4
        id: cargo-cache
        with:
          path: cargo-cache
          key: docker-cargo-amd64-${{ github.sha }}
          restore-keys: docker-cargo-amd64-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "cargo-cache/registry": {"target": "/usr/local/cargo/registry", "id": "cargo-registry"},
              "cargo-cache/git": {"target": "/usr/local/cargo/git", "id": "cargo-git"},
              "cargo-cache/modules-target": {"target": "/src/modules/target", "id": "modules-target"},
              "cargo-cache/server-target": {"target": "/src/target", "id": "server-target-amd64"}
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Same scope as the amd64 release build, which reuses this cache.
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

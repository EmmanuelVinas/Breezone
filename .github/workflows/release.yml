# Publishes the Docker image to GitHub Container Registry when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# → ghcr.io/<owner>/breezone:0.1.0, :0.1 and :latest (linux/amd64 + linux/arm64, e.g. NAS).
#
# Each platform is built natively on its own runner (no QEMU emulation, which made the arm64
# Rust build several times slower), then both images are joined under the same tags.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lowercase (the owner is EmmanuelVinas).
      - run: |
          echo "IMAGE=ghcr.io/${OWNER,,}/breezone" >> "$GITHUB_ENV"
          echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
          PLATFORM: ${{ matrix.platform }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # Pushed by digest only: the tags are set once both platforms are built.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.ARCH }}
          cache-to: type=gha,scope=${{ env.ARCH }},mode=max
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.ARCH }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMAGE=ghcr.io/${OWNER,,}/breezone" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | ("-t", .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=()
          for d in *; do digests+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
      - run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

  github-release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

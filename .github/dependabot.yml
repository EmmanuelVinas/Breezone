# Dependency updates, once a month. Minor and patch updates are grouped into one pull request
# per ecosystem; major updates come one by one (they may need code changes).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule: { interval: monthly }
    groups:
      server-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /mobile
    schedule: { interval: monthly }
    groups:
      mobile-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    groups:
      docker-minor:
        update-types: [minor, patch]
    ignore:
      # Node: long-term support (even) versions only; odd versions are short-lived.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x", "31.x"]

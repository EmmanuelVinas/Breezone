[package]
name = "breezone-server"
version = "0.11.0-beta.6"
edition = "2021"
description = "Breezone — self-hosted hub that drives the local Airzone API and serves the mobile app and web UI"
default-run = "breezone-server"

[lib]
name = "breezone_server"
path = "src/lib.rs"

[[bin]]
name = "breezone-server"
path = "src/main.rs"

# Fake Airzone WebServer, to develop and demo without real hardware.
[[bin]]
name = "mock-airzone"
path = "src/bin/mock_airzone.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "set-header"] }
anyhow = "1"
thiserror = "2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
argon2 = "0.6.0"
rand = "0.10.3"
sha2 = "0.11.1"
hex = "0.4.3"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3"
# Self-update: release archives (.tar.gz).
tar = "0.4"
flate2 = "1"
hkdf = "0.13"
num-bigint = "0.4"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

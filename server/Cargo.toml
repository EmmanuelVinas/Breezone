[package]
name = "breezone-server"
version = "0.13.0-beta.9"
edition = "2021"
description = "Breezone — self-hosted hub that drives the local Airzone API and serves the mobile app and web UI"
default-run = "breezone-server"

[lib]
name = "breezone_server"
path = "src/lib.rs"

[[bin]]
name = "breezone-server"
path = "src/main.rs"

# Fake Airzone WebServer, to develop and demo without real hardware.
[[bin]]
name = "mock-airzone"
path = "src/bin/mock_airzone.rs"

# Packages and index of the modules, for the publishing workflow.
[[bin]]
name = "module-publish"
path = "src/bin/module_publish.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "set-header"] }
anyhow = "1"
thiserror = "2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
argon2 = "0.6.0"
rand = "0.10.3"
sha2 = "0.11.1"
hex = "0.4.3"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
futures-util = "0.3.34"
# The MCP tools send their calls through the API router (`oneshot`).
tower = { version = "0.5", default-features = false, features = ["util"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3"
# Versions and requirements of the modules (docs/roadmap/modules.md § 4.4).
semver = "1"
# Self-update: release archives (.tar.gz).
tar = "0.4"
flate2 = "1"
hkdf = "0.13"
num-bigint = "0.4"
aes = "0.9.4"
sha1 = "0.11.0"
# Matter bridge (ADR 0015): the Matter stack, its executor pieces and the mDNS socket.
rs-matter = { version = "=0.4.1", features = ["async-io", "groups", "persistent-subscriptions", "max-groups-per-fabric-12", "max-group-keys-per-fabric-3", "max-group-endpoints-per-fabric-3", "max-sessions-32"] }
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
async-io = "2"
futures-lite = "2"
if-addrs = "0.15"
socket2 = { version = "0.6", features = ["all"] }
# Modules in WebAssembly (docs/roadmap/modules.md): the `wasm` feature, on by default (without it,
# only the modules compiled into the server run).
wasmtime = { version = "51", optional = true, default-features = false, features = ["runtime", "std", "cranelift", "component-model", "async", "parallel-compilation"] }
wasmtime-wasi = { version = "51", optional = true, default-features = false, features = ["p2"] }
# The WebSocket subscriptions of the modules (`host.subscribe`).
tokio-tungstenite = { version = "0.30.0", optional = true }
# Their `wss://` subscriptions.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
webpki-roots = { version = "1", optional = true }

[features]
default = ["wasm"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:tokio-tungstenite", "dep:tokio-rustls", "dep:webpki-roots"]

# Built for a small memory footprint at run time (100 MB), not for the size of the binary: the
# dependencies keep their parallel code generation and the link-time optimisation is the thin one,
# which compile several times faster for a few more megabytes of binary.
# The tests compile modules with cranelift: optimised, even in a development build.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
# On a Mac (development), the Matter service is announced by Bonjour, which holds the mDNS port.
[target.'cfg(target_os = "macos")'.dependencies]
rs-matter = { version = "=0.4.1", features = ["astro-dnssd"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# The HomeKit accessory of the tests (`tests/support/hap.rs`), the encrypted ESPHome node.
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
snow = "0.10.0"
# A picture encrypted as EZVIZ does it (`tests/ezviz.rs`).
md-5 = "0.11.0"
cbc = "0.2.1"
tokio-tungstenite = "0.30.0"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
